# SEO metadata for the generated REST API pages.
# title and description set the HTML <title> and meta description. sidebarTitle
# repeats the operation summary so the navigation label and URL do not change.
# x-mint.metadata.description replaces the page subtitle, so each operation's
# own description is copied into x-mint.content to keep it on the page.
overlay: 1.1.0
info:
  title: HEVN REST API SEO metadata
  version: 1.0.0
extends: ../openapi.json
